[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exceler"
version = "0.1.0"
description = "Discovery engine for informal corporate Excel data stores"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "txemazapater" }]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "typer>=0.15.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-setuptools",
  "openpyxl>=3.1.5",
]

[project.scripts]
exceler = "exceler.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/exceler"]

[tool.hatch.build.targets.sdist]
include = [
  "src/exceler",
  "alembic",
  "alembic.ini",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
  "unit: unit/application tests without Docker or PostgreSQL",
  "integration: persistence/API tests that require PostgreSQL",
  "docker: tests that require Docker/Compose",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["exceler"]
mypy_path = "src"
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["alembic.*", "openpyxl.*"]
ignore_missing_imports = true
